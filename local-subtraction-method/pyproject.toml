[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsmethod"
version = "0.1.0"
description = "Symbolic and numerical checks for local subtraction method kernels"
requires-python = ">=3.12"
dependencies = [
    "mpmath",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "symbolica",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
